name: Customer auth preview QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'customer-auth-preview/**'
      - '.github/workflows/customer-auth-preview-qa.yml'
      - 'render-staging/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: customer-auth-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --save-exact @neon/auth vite
      - run: node --check src/main.js
      - run: npx vite build --base /customer-preview/
        env:
          VITE_NEON_AUTH_URL: https://ep-orange-art-bcq396ri.neonauth.c-16.us-east-1.aws.neon.tech/neondb/auth
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-auth-preview
          path: |
            customer-auth-preview/dist
            customer-auth-preview/package-lock.json
          retention-days: 7
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: render-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
  package-preview:
    needs: [build, backend-tests]
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'customer-email-code-20261128' && github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-email-code-20261128
      - name: Require exact tested source
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/download-artifact@v4
        with:
          name: isolated-auth-preview
          path: /tmp/customer-build
      - name: Stage tested build on preview branch only
        run: |
          test -f /tmp/customer-build/dist/index.html
          mkdir -p render-staging/customer_ui
          cp -r /tmp/customer-build/dist/. render-staging/customer_ui/
          git add render-staging/customer_ui
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then git commit -m "Package tested email code preview [skip ci]"; git push origin HEAD:customer-email-code-20261128; fi
