name: Customer auth preview QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'customer-auth-preview/**'
      - '.github/workflows/customer-auth-preview-qa.yml'
      - 'render-staging/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: customer-auth-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --save-exact @neon/auth vite
      - run: node --check src/main.js
      - run: npx vite build --base ./
        env:
          VITE_NEON_AUTH_URL: https://ep-orange-art-bcq396ri.neonauth.c-16.us-east-1.aws.neon.tech/neondb/auth
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-auth-preview
          path: |
            customer-auth-preview/dist
            customer-auth-preview/package-lock.json
          retention-days: 7
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: render-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
