name: ARAZVERA Public Catalogue — quote-flow regression

on:
  push:
    paths:
      - "buyer-lab/store-demo/**"
      - "buyer-lab/catalog.json"
      - ".github/workflows/store-demo-qa.yml"
  pull_request:
    paths:
      - "buyer-lab/store-demo/**"
      - "buyer-lab/catalog.json"
      - ".github/workflows/store-demo-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install DOM harness (CI only)
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Check public catalogue, quote list and payment boundaries
        run: node --test buyer-lab/store-demo/storefront.test.mjs tests/storefront_demo_guard.test.mjs
